<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;}
#webcam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
#canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
.jutsu-vid{position:absolute;pointer-events:none;display:none;mix-blend-mode:screen;transform:translate(-50%,-50%);z-index:3;filter:brightness(1.4) saturate(1.3);}
#label-left{position:absolute;bottom:28px;left:28px;font-family:monospace;font-size:18px;font-weight:bold;letter-spacing:3px;color:#fff;text-shadow:0 0 14px #fff;opacity:0;transition:opacity 0.2s;z-index:10;pointer-events:none;}
#label-right{position:absolute;bottom:28px;right:28px;font-family:monospace;font-size:18px;font-weight:bold;letter-spacing:3px;color:#fff;text-shadow:0 0 14px #fff;opacity:0;transition:opacity 0.2s;z-index:10;pointer-events:none;}
</style>
</head>
<body>
<video id="webcam" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<video id="ras-vid" class="jutsu-vid" muted autoplay loop playsinline src="assets/videoplayback (2).mp4"></video>
<video id="rsh-vid" class="jutsu-vid" muted autoplay loop playsinline src="assets/videoplayback.mp4"></video>
<div id="label-left">RASENGAN</div>
<div id="label-right">RASENSHURIKEN</div>
<script>
const webcam   = document.getElementById('webcam');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const rasVid   = document.getElementById('ras-vid');
const rshVid   = document.getElementById('rsh-vid');
const lblLeft  = document.getElementById('label-left');
const lblRight = document.getElementById('label-right');
const TWO_PI   = Math.PI*2;

const feed     = document.createElement('canvas');
const feedCtx  = feed.getContext('2d');

const TIPS  = [4,8,12,16,20];
const MCPS  = [2,5,9,13,17];
const CONN  = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17],[0,5],[0,17]];
const FACES = [[0,1,5],[1,2,5],[2,5,9],[5,6,9],[6,7,9],[7,8,12],[9,10,12],[10,11,12],[0,5,17],[5,9,13],[9,13,17],[13,14,17],[14,15,17],[15,16,20],[17,18,20],[18,19,20]];

let rasCharge=0,rshCharge=0;
let lastRasPalm=[0,0],lastRshPalm=[0,0];
let prevTime=performance.now();

function lm2display(lms){
  const W=innerWidth,H=innerHeight,cW=webcam.videoWidth||1280,cH=webcam.videoHeight||720;
  const sc=Math.max(W/cW,H/cH),rW=cW*sc,rH=cH*sc,ox=(W-rW)/2,oy=(H-rH)/2;
  return lms.map(l=>[(1-l.x)*rW+ox,l.y*rH+oy]);
}
function palmCenter(px){
  const pts=[px[0],...MCPS.map(i=>px[i])];
  return[pts.reduce((s,p)=>s+p[0],0)/pts.length,pts.reduce((s,p)=>s+p[1],0)/pts.length];
}
function isOpen(lms){
  let up=0;
  for(let i=1;i<TIPS.length;i++) if(lms[TIPS[i]].y<lms[MCPS[i]].y) up++;
  if(Math.abs(lms[4].x-lms[2].x)>0.07) up++;
  return up>=3;
}
function isFist(lms){
  let c=0;
  for(let i=1;i<TIPS.length;i++) if(lms[TIPS[i]].y>lms[MCPS[i]].y) c++;
  return c>=3;
}
function drawHandMesh(px){
  ctx.save();ctx.globalAlpha=0.22;ctx.fillStyle='#003a00';
  for(const[a,b,c]of FACES){ctx.beginPath();ctx.moveTo(px[a][0],px[a][1]);ctx.lineTo(px[b][0],px[b][1]);ctx.lineTo(px[c][0],px[c][1]);ctx.closePath();ctx.fill();}
  ctx.restore();
  ctx.save();ctx.strokeStyle='#00d450';ctx.lineWidth=2;ctx.shadowBlur=10;ctx.shadowColor='#00ff80';
  for(const[a,b]of CONN){ctx.beginPath();ctx.moveTo(px[a][0],px[a][1]);ctx.lineTo(px[b][0],px[b][1]);ctx.stroke();}
  ctx.restore();
  ctx.save();ctx.shadowBlur=6;ctx.shadowColor='#00ff80';
  for(const pt of px){ctx.beginPath();ctx.arc(pt[0],pt[1],4,0,TWO_PI);ctx.fillStyle='#00ff64';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#00d450';ctx.stroke();}
  ctx.restore();
}
function placeVid(vid,cx,cy,baseSize,charge,liftPx){
  const sz=Math.round(baseSize*(0.7+0.6*charge));
  vid.style.width=sz+'px';
  vid.style.left=cx+'px';
  vid.style.top=(cy-liftPx)+'px';
  vid.style.display='block';
  vid.style.opacity=Math.min(1,0.6+charge*0.5).toFixed(3);
}
function onResults(res){
  const now=performance.now();
  const dt=Math.min((now-prevTime)/1000,0.05);
  prevTime=now;
  canvas.width=innerWidth;canvas.height=innerHeight;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let L=null,R=null;
  if(res.multiHandLandmarks&&res.multiHandedness){
    res.multiHandLandmarks.forEach((lms,i)=>{
      const px=lm2display(lms),palm=palmCenter(px),open=isOpen(lms),fist=isFist(lms);
      if(res.multiHandedness[i].label==='Right') L={px,palm,open,fist,lms};
      else R={px,palm,open,fist,lms};
    });
  }
  if(L) drawHandMesh(L.px);
  if(R) drawHandMesh(R.px);

  const rasActive=L&&L.open&&!L.fist;
  const rshActive=R&&R.open&&!R.fist;

  if(rasActive) rasCharge=Math.min(1,rasCharge+dt*0.7);
  else          rasCharge=Math.max(0,rasCharge-dt*3);
  if(rshActive) rshCharge=Math.min(1,rshCharge+dt*0.7);
  else          rshCharge=Math.max(0,rshCharge-dt*3);

  if(L) lastRasPalm=L.palm;
  if(R) lastRshPalm=R.palm;

  rasVid.style.display='none';
  rshVid.style.display='none';
  if(rasCharge>0.01) placeVid(rasVid,lastRasPalm[0],lastRasPalm[1],460,rasCharge,170+rasCharge*80);
  if(rshCharge>0.01) placeVid(rshVid,lastRshPalm[0],lastRshPalm[1],580,rshCharge,180+rshCharge*90);

  lblLeft.style.opacity  = rasCharge>0.01 ? Math.min(1,rasCharge*2).toFixed(3) : 0;
  lblRight.style.opacity = rshCharge>0.01 ? Math.min(1,rshCharge*2).toFixed(3) : 0;
}

const handsMP = new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
handsMP.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.7,minTrackingConfidence:0.6});
handsMP.onResults(onResults);

webcam.addEventListener('loadedmetadata', () => {
  feed.width  = webcam.videoWidth  || 1280;
  feed.height = webcam.videoHeight || 720;
});

async function tick() {
  if(webcam.readyState >= 2) {
    feed.width  = webcam.videoWidth  || 1280;
    feed.height = webcam.videoHeight || 720;
    feedCtx.drawImage(webcam, 0, 0, feed.width, feed.height);
    await handsMP.send({image: feed});
  }
  requestAnimationFrame(tick);
}

navigator.mediaDevices.getUserMedia({video:{width:1280,height:720},audio:false}).then(stream=>{
  webcam.srcObject=stream;
  webcam.play();
  rasVid.play().catch(()=>{});
  rshVid.play().catch(()=>{});
  requestAnimationFrame(tick);
});
</script>
</body>
</html>
